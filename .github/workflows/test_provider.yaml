name: Provider Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # both ends of the Python the supported Home Assistant versions run
    # on: 3.12 for 2024.12, 3.14 for today's
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r tests_provider/requirements.txt

      - name: Run tests
        run: pytest tests_provider/

      # results.txt / results.json of the run, to read a failure without
      # running it again
      - name: Keep the results files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests_provider-results-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore
