name: Provider Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r tests_provider/requirements.txt

      - name: Run tests
        run: pytest tests_provider/

      # results.txt / results.json of the run, to read a failure without
      # running it again
      - name: Keep the results files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests_provider-results
          path: test-results/
          if-no-files-found: ignore
