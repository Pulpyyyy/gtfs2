name: Complexity

on:
  push:
  pull_request:

# Each function's McCabe complexity (ruff C901) under a ceiling: 10 for a
# new function, the recorded value (.github/complexity.json) for those
# already past it, lowered in the same commit as the function gets simpler,
# never raised to make a push pass. And no pyflakes finding (ruff F): an
# unused import or variable, a name that does not exist. ruff is pinned so
# the measure holds still.
jobs:
  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff==0.16.9

      - name: Hold the ceilings
        run: python .github/complexity.py

      - name: No pyflakes finding
        run: ruff check --select F custom_components/gtfs2
