name: Synthetic Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # the Python the supported Home Assistant versions run on: 3.14 from
    # 2026.3, the minimum
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Run tests
        run: pytest tests/

      # results.txt / results.json of the run, to read a failure without
      # running it again
      - name: Keep the results files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-results-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore
