name: Types

on:
  push:
  pull_request:

# What each function takes and returns, written in its signature and held
# to the code by mypy, every module of the component (mypy.ini). mypy is
# pinned so the check holds still.
jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install mypy, and what tests/ installs
        run: pip install mypy==2.3.1 types-requests==2.33.0.20260906 -r tests/requirements.txt

      - name: Hold the annotations
        run: mypy custom_components/gtfs2
