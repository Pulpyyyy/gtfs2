# Describes the format for available ADS services
update_gtfs:
  name: Update/create GTFS Data
  description: >-
    Refreshes a datasource from its feed, or creates one. A datasource that
    exists is refreshed from its own address and key, the ones its
    configuration screen shows: only its name is needed here. The address
    and key fields are read to create a datasource that does not exist yet.
  fields:
    extract_from:
      name: Indicate source of the data
      description: >-
        Download the feed again (url), or rebuild from the zip already in the
        gtfs2 folder (zip)
      required: true
      example: "url"
      default: "url"
      selector:
        select:
          translation_key: "extract_from"
          options:
            - "url"
            - "zip"
    file:
      name: Name of the transport service, without .zip
      description: >-
        The datasource to refresh. A name that exists is refreshed in place;
        a new name creates a datasource from the fields below
      required: true
      example: "mytransportservice"
      selector:
        text:
    url:
      name: URL
      description: >-
        The full path to the zip file itself. Only read when creating a
        datasource: an existing one keeps the address of its configuration
        screen, and a different one given here is ignored with a warning
      required: false
      example: "https://path-to-my-zip-file-location/filename.zip"
      selector:
        text:
    api_key:
      name: api_key
      description: >-
        API key, if the provider requires one. Only read when creating a
        datasource, like the address
      required: false
      selector:
        text:
    api_key_name:
      name: api_key_name
      description: API key_name when using api_key
      required: false
      default: "api_key"
      example: "api_key"
      selector:
        text:
    api_key_location:
      name: Indicate location of the key
      description: Select location of the key
      required: false
      default: "not_applicable"
      example: "not_applicable"
      selector:
        select:
          translation_key: "api_key_location"
          options:
            - "not_applicable"
            - "header"
            - "query_string"     
    clean_feed_info:
      name: Remove feed-info
      description: Removes feed_info.txt from zip (use in case file content incorrect)
      required: false
      default: false
      selector:
        boolean: 
    check_source_dates:
      name: (Experimental feature) Check source validity
      description: Verify if the new file has only future dates, then cancel
      required: false
      default: false
      selector:
        boolean: 

update_gtfs_rt_local:
  name: Update GTFS Realtime Data locally
  description: Downloads realtime data locally
  fields:
    file:
      name: Name of the transport service with realtime data
      description: Preferably use the same name as for static data
      required: true
      example: "mytransportservice"
      selector:
        text:            
    url:
      name: URL
      description: provide the full path to the zip file itself
      required: true
      default: "na"
      example: "https://path-to-my-realttime-data"
      selector:
        text:
    api_key:
      name: api_key
      description: provide API key, if required
      required: false
      selector:
        text:        
    api_key_name:
      name: api_key_name
      description: API key_name when using api_key
      required: false
      default: "api_key"
      example: "api_key"
      selector:
        text:         
    api_key_location:
      name: Indicate location of the key
      description: Select location of the key
      required: false
      default: "not_applicable"
      example: "not_applicable"
      selector:
        select:
          translation_key: "api_key_location"
          options:
            - "not_applicable"
            - "header"
            - "query_string"     
    accept:
      name: Accept
      description: add application/protobuf to the header
      default: false
      required: false
      selector:
        boolean: 
        
    rt_type:
      name: Indicate type of realtime data 
      description: Select type of realtime data from source
      required: true
      default: "trip_data"
      selector:
        select:
          translation_key: "extract_from"
          options:
            - "trip_data"
            - "vehicle_positions"   
            - "alerts"
            
    entity_for_siri:
      name: SIRI RT Route
      description: For SIRI realtime only (!) select your configuration
      required: false
      selector:
        entity:
          integration: "gtfs2"            
      
    debug_output:
      name: Save all to local file in readable format
      description: for debug purposes, see /config/www/gtfs2
      required: false
      default: false
      selector:
        boolean:         
        
update_gtfs_local_stops: 
  name: Update Local Stops
  description: Updates local stops based on location entity
  fields:       
    entity_id:
      name: Entity
      description: Select person or zone to update stops for
      required: true
      example: "zone.home"
      selector:
        entity:
          domain: ["person", "zone"]
          
          
extract_departures: 
  name: Extract Departures
  description: Extracts all next departures from your entity up-until tomorrow EOD
  fields:       
    config_entry:
      name: Route
      description: Select your start/stop configuration
      required: true
      selector:
        config_entry:
          integration: "gtfs2"
    from_time:
      name: The time after which departures are collected
      required: false
      description: "The time after which you would like to receive the slots.\n If left empty then all future slots will be extracted for today/tomorrow.\n In yaml this has to be 24H format"
      selector:
        time: {}  

extract_trip_stops: 
  name: Extract Trip Stops
  description: Extracts all stops for the upcoming trips
  fields:       
    entity_id:
      name: Entity ID
      description: Select your Entity
      required: true
      selector:
        entity:
          integration: "gtfs2"

set_include_tomorrow:
  name: Set include_tomorrow
  description: Enables/disables include_tomorrow on existing start/end entries (updates the config entry and reloads it), without recreating them
  fields:
    enabled:
      name: Enabled
      description: true to include tomorrow's departures after the last of the day
      required: true
      default: true
      selector:
        boolean:
    entry_id:
      name: Config entry id
      description: Limit to one config entry (default, all start/end entries)
      required: false
      example: "01M0D312WVNW3VYW8CKQDFE0YE"
      selector:
        text:

prune_datasource:
  name: Prune Datasource
  description: >-
    Removes the trips and stop_times of routes that no entry is configured for.
    pygtfs loads the whole feed, so a datasource holds every route of the network;
    pruning typically reclaims most of the file. Schema and routes are left intact,
    so the config flow still lists every route. Re-run "update_gtfs" to restore the
    full feed from the local zip.
  fields:
    file:
      name: Datasources
      description: >-
        The sources to prune, picked as devices. From yaml, plain datasource
        names still work. Leave empty to prune every known datasource; sources
        a train or local stops sensor needs whole are skipped and say so in
        the response.
      required: false
      example: tao
      selector:
        device:
          multiple: true
          # only the datasource devices carry a gtfs2 switch: this is what
          # keeps the journey sensors' devices out of the list
          entity:
            - integration: gtfs2
              domain: switch
    dry_run:
      name: Dry run
      description: Report what would be removed without changing anything.
      required: false
      default: false
      selector:
        boolean:

intern_datasource:
  name: Intern Datasource
  description: >-
    Replaces the long trip_id/stop_id strings of stop_times by integer keys and
    re-exposes stop_times as a view, so queries keep working unchanged. Run this
    after "prune_datasource". Not reversible in place: re-run "update_gtfs" to
    rebuild the full datasource from the local zip.
  fields:
    file:
      name: Datasources
      description: >-
        The sources to shrink, picked as devices. From yaml, plain datasource
        names still work. Leave empty to intern every known datasource.
      required: false
      example: tao
      selector:
        device:
          multiple: true
          # only the datasource devices carry a gtfs2 switch: this is what
          # keeps the journey sensors' devices out of the list
          entity:
            - integration: gtfs2
              domain: switch
    dry_run:
      name: Dry run
      description: Report what would be interned without changing anything.
      required: false
      default: false
      selector:
        boolean:
