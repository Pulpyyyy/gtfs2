# Read by the type gate (CI: Types). A module listed below has every
# function annotated, and mypy holds the annotations to the code. The rest
# of the component is read for the names those modules use, not checked,
# until its turn comes. Home Assistant and the libraries are not installed
# for the gate, only the types of requests: what comes from the others
# reads as Any.

[mypy]
python_version = 3.14
explicit_package_bases = True
ignore_missing_imports = True
warn_unused_ignores = True
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-custom_components.gtfs2.*]
ignore_errors = True

[mypy-custom_components.gtfs2.feed_window]
ignore_errors = False

[mypy-custom_components.gtfs2.zip_peek]
ignore_errors = False
