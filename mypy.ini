# Read by the type gate (CI: Types). Every function of the component is
# annotated, and mypy holds the annotations to the code; a module added
# later is held to them from its first line. The gate installs what tests/
# installs, and the types of requests; Home Assistant is not installed,
# what comes from it reads as Any.

[mypy]
python_version = 3.14
explicit_package_bases = True
ignore_missing_imports = True
disallow_untyped_defs = True
disallow_incomplete_defs = True

# the flow is declared the way Home Assistant writes it, domain=DOMAIN on
# the class; without Home Assistant installed mypy finds no class taking
# that keyword, so this one module is not held to call arguments
[mypy-custom_components.gtfs2.config_flow]
disable_error_code = call-arg
