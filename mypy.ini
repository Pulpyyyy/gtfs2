# Read by the type gate (CI: Types). A module listed below has every
# function annotated, and mypy holds the annotations to the code. The rest
# of the component is read for the names those modules use, not checked,
# until its turn comes. The gate installs what tests/ installs, and the
# types of requests; Home Assistant is not installed, what comes from it
# reads as Any.

[mypy]
python_version = 3.14
explicit_package_bases = True
ignore_missing_imports = True
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-custom_components.gtfs2.*]
ignore_errors = True

[mypy-custom_components.gtfs2.feed_window]
ignore_errors = False

[mypy-custom_components.gtfs2.zip_peek]
ignore_errors = False

[mypy-custom_components.gtfs2.rt_feed]
ignore_errors = False
